<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống Phát hiện Đăng nhập Bất thường</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .sidebar {
        min-height: 100vh;
        background-color: #212529;
        color: white;
      }
      .sidebar a {
        color: #adb5bd;
        text-decoration: none;
        padding: 12px 20px;
        display: block;
      }
      .sidebar a:hover,
      .sidebar a.active {
        color: white;
        background-color: #0d6efd;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-2 p-0 sidebar">
          <h4 class="text-center py-4 border-bottom border-secondary mb-3">
            <i class="bi bi-shield-lock"></i> Security Admin
          </h4>
          <a href="/dashboard" id="nav-dashboard"
            ><i class="bi bi-speedometer2 me-2"></i> Dashboard</a
          >
          <a href="/logs" id="nav-logs"
            ><i class="bi bi-journal-text me-2"></i> Nhật ký đăng nhập</a
          >
          <a href="/alerts" id="nav-alerts"
            ><i class="bi bi-exclamation-triangle me-2"></i> Quản lý Cảnh báo</a
          >
          <a href="/rules" id="nav-rules"
            ><i class="bi bi-gear me-2"></i> Cấu hình Quy tắc</a
          >
          <hr class="border-secondary" />
          <a href="/login" target="_blank"
            ><i class="bi bi-box-arrow-in-right me-2"></i> Trang Đăng nhập
            (Client)</a
          >
        </div>

        <!-- Main Content Area -->
        <div class="col-md-10 p-4">{% block content %}{% endblock %}</div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
